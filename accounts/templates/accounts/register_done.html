{% extends "base.html" %}

{% block title %}Check your email{% endblock %}

{% block content %}
<h1>Check your email</h1>
<p>We sent a verification link to your email address. Click it to activate your account.</p>
<p>Didn't get it?</p>
<form method="post" action="/resend-verification/">
    {% csrf_token %}
    <input type="hidden" name="email" value="{{ email }}">
    <button type="submit" class="btn btn-outline-secondary">Resend the verification email</button>
</form>
{% endblock %}
