{% extends "base.html" %}

{% block title %}Check your email{% endblock %}

{% block content %}
<div class="auth-wrap">
<div class="auth-container">
    {% include "partials/auth_logo.html" %}

    <div class="card auth-card text-center">
        <div class="auth-icon-circle">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M2.5 6.5L10 11.5L17.5 6.5M3 15h14a1 1 0 001-1V6a1 1 0 00-1-1H3a1 1 0 00-1 1v8a1 1 0 001 1z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>
        <h1>Check your email</h1>
        <p class="auth-sub">
            We sent a verification link to <span class="fw-medium text-body">{{ email }}</span>.
            It expires in 24 hours.
        </p>
        <form method="post" action="/resend-verification/">
            {% csrf_token %}
            <input type="hidden" name="email" value="{{ email }}">
            <p class="mb-0 text-secondary" style="font-size: 0.75rem;">
                Didn't receive it? <button type="submit" class="btn btn-link p-0 align-baseline">Resend</button>
            </p>
        </form>
        <a href="/login/" class="d-inline-block mt-4 text-secondary text-decoration-none small">← Back to sign in</a>
    </div>
</div>
</div>
{% endblock %}
