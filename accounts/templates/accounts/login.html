{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="text-center mb-4">
        <span class="auth-logo mb-2">D</span>
        <div class="fw-semibold fs-5">DevBoard</div>
    </div>
    <div class="card auth-card">
        <div class="card-body p-4">
            <h1 class="h4 mb-1">Welcome back</h1>
            <p class="text-secondary small mb-4">Sign in to your workspace</p>
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <label class="form-label">Password</label>
                        <a href="/forgot-password/" class="small">Forgot password?</a>
                    </div>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <p class="text-center small text-secondary mt-3 mb-0">
                <a href="/register/">Create an account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
